<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ameer — Admin</title>
<style>
body{margin:0;background:#f6f7f9;color:#111;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d5d9df;border-radius:9px;font:inherit}
textarea{min-height:100px}.full{grid-column:1/-1}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.ghost{background:#eceff2}.danger{background:#fee;color:#a00}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-top:8px}
.muted{color:#69707b}.hidden{display:none}.status{padding:10px;border-radius:9px;background:#eef2f5;margin:12px 0}.error{background:#fff0f0;color:#a00}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:14px}}

.media-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}
.media-upload-panel{display:grid;grid-template-columns:180px 1fr auto;gap:12px;align-items:end;padding:16px;border:1px solid #e6e8ec;border-radius:14px;background:#fafbfc;margin-bottom:18px}
.media-upload-panel label{margin:0}
.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.media-card{border:1px solid #e6e8ec;border-radius:14px;overflow:hidden;background:#fff}
.media-preview{height:180px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media-preview img{width:100%;height:100%;object-fit:contain;background:#fff}
.media-preview audio{width:92%}
.media-generic{font-weight:900;letter-spacing:2px;color:#7a828e}
.media-info{padding:12px;display:grid;gap:3px}
.media-info strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-info span,.media-info small{color:#69707b;font-size:12px}
.media-actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 12px}
.media-open{display:inline-flex;text-decoration:none;align-items:center}
@media(max-width:820px){.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.media-upload-panel{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.media-grid{grid-template-columns:1fr}.media-upload-panel{grid-template-columns:1fr}.media-preview{height:220px}}


.media-pick-btn{margin-top:7px}
.media-picker-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px}
.media-picker-dialog{width:min(980px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.media-picker-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
.media-picker-head h3{margin:0 0 4px}.media-picker-folders{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.media-picker-folders button.active{background:#111;color:#fff}
.media-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.media-picker-card{display:block;text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:8px;cursor:pointer}
.media-picker-card:hover{border-color:#111}
.media-picker-card strong{display:block;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-picker-card span{display:block;color:#69707b;font-size:12px;margin-top:2px}
.media-picker-preview{height:130px;background:#f3f4f6;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media-picker-preview img{width:100%;height:100%;object-fit:contain;background:#fff}
@media(max-width:850px){.media-picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.media-picker-grid{grid-template-columns:1fr}.media-picker-dialog{padding:12px}}

</style></head><body><div class="wrap">
<header><h1>Ameer Admin</h1><button id="logout" class="ghost hidden">Log out</button></header>
<section id="loginCard" class="card"><h2>Owner login</h2><p class="muted">Use your Supabase Auth account.</p>
<div class="grid"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="password" type="password"></div></div><br>
<button id="login" class="primary">Sign in</button><div id="loginStatus" class="status hidden"></div></section>
<section id="dashboard" class="hidden"><div id="tabs" class="tabs"></div><div id="status" class="status hidden"></div><div class="card"><div id="editor"></div></div></section>
</div><script src="../js/supabase-config.js"></script><script type="module" src="../js/admin.js?v=2"></script>
